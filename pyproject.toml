[project]
name = "retail-adhoc-analysis"
version = "0.1.0"
description = "Ad-hoc analysis of supermarket purchases (dunnhumby The Complete Journey)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "pyspark==3.5.9",
    "duckdb==1.5.6",
    "pandas==2.3.3",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "statsmodels==0.15.0",
    "scipy==1.17.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "pyyaml==6.0.3",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
    "ipykernel==7.4.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D"]
# `from pyspark.sql import functions as F` is the conventional PySpark alias.
ignore = ["N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
